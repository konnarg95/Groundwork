<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open-home feedback · PropIQ</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#17191d;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:660px;margin:auto;padding:24px 16px 70px}.brand{font-size:24px;font-weight:800;letter-spacing:-1px}.card{background:#fff;border:1px solid #e2e5e9;border-radius:22px;padding:26px;margin-top:22px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}p{color:#65707c;line-height:1.6}fieldset{border:0;padding:0;margin:25px 0}legend{font-weight:750;margin-bottom:10px}label{display:block;font-size:14px;font-weight:650;margin:18px 0 7px}input,textarea{width:100%;padding:14px;border:1px solid #d6dce1;border-radius:11px;font:inherit}textarea{min-height:95px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.choices label{border:1px solid #dce1e5;border-radius:10px;text-align:center;margin:0;padding:12px 4px;font-size:11px;cursor:pointer;font-weight:500}.choices input{width:auto;display:block;margin:0 auto 8px;accent-color:#17191d}.choices label:has(input:checked){border-color:#17191d;background:#edf1f4}button{background:#111;color:#fff;border:0;padding:15px 24px;border-radius:12px;font-weight:700;font-size:16px;width:100%;cursor:pointer}button:disabled{opacity:.5}.fine{font-size:12px}#status{font-weight:650}@media(max-width:450px){.card{padding:19px}.choices{gap:3px}.choices label{font-size:10px;padding:9px 2px}h1{font-size:28px}} .price-wrap{display:flex;align-items:center;border:1px solid #cfd5db;border-radius:14px;overflow:hidden;margin-top:8px}.price-wrap span{font-size:26px;font-weight:750;padding:0 0 0 17px}.price-wrap input{border:0;outline:0;font-size:27px;font-weight:750;min-width:0}.price-wrap:focus-within{border-color:#111;box-shadow:0 0 0 3px #1111} </style></head><body><div class="wrap"><div class="brand">⌂ PropIQ</div><div class="card"><div style="font-size:12px;letter-spacing:1px;color:#6b747c;font-weight:700">OPEN HOME · PRICE OPINION</div><h1 id="address">What is this home worth?</h1><p>Thanks for visiting. Just one question — what do you believe this home is worth?</p><form id="form"><label for="price">What do you believe this home is worth?</label><div class="price-wrap"><span aria-hidden="true">$</span><input id="price" name="price" type="number" inputmode="numeric" min="10000" max="100000000" step="1000" placeholder="1,250,000" aria-label="Your estimated property value in Australian dollars" required autofocus></div><div style="display:none" aria-hidden="true"><label>Website<input id="website" autocomplete="off" tabindex="-1"></label></div><p class="fine">Your estimate is anonymous and is shared with the listing agent as buyer price feedback. It is not an offer to purchase.</p><button id="submit" type="submit">Submit my estimate</button><p id="status" role="status"></p></form></div></div><script>
const params=new URLSearchParams(location.search),id=params.get('c'),preview=params.get('preview')==='1';async function init(){if(preview){document.getElementById('address').textContent='Sample property — Aspley QLD';document.getElementById('status').textContent='Preview only — responses will not be saved.';return}if(!id){document.getElementById('form').hidden=true;document.getElementById('address').textContent='Invalid feedback link';return}try{const r=await fetch('/api/openhome/public?c='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Link unavailable');document.getElementById('address').textContent=d.address}catch(e){document.getElementById('form').hidden=true;document.getElementById('address').textContent='Feedback form unavailable';document.getElementById('status').textContent=e.message}}init();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');if(preview){status.textContent='Preview only — sign in as an agent to create a real QR link.';return}const submit=document.getElementById('submit');submit.disabled=true;status.textContent='Sending…';try{const price=Number(document.getElementById('price').value);if(!Number.isFinite(price)||price<10000||price>100000000)throw Error('Enter a valid price estimate.');const r=await fetch('/api/openhome/public',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({campaign_id:id,buyer_name:'Anonymous',price,comment:'',ratings:{},website:document.getElementById('website').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to submit');document.getElementById('form').innerHTML='<h2>Thank you for your feedback.</h2><p>Your price estimate has been shared with the listing agent.</p>'}catch(e){status.textContent=e.message;submit.disabled=false}});
</script></body></html>
